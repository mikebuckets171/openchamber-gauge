<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Gauge</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--oc-font, system-ui, sans-serif);
    font-size: 1rem;
    line-height: 1.5;
    color: var(--oc-fg, inherit);
    background: transparent;
    overflow: hidden;
  }
  #root { padding: .25rem 0 .5rem; }

  /* The headline: the speed, its unit, and the state on the far right. */
  .hero {
    display: flex;
    align-items: baseline;
    gap: .375rem;
    height: 2rem;
    white-space: nowrap;
    overflow: hidden;
  }
  .dot {
    display: inline-block;
    width: .4375rem;
    height: .4375rem;
    border-radius: 50%;
    background: var(--oc-primary, #888);
    align-self: center;
    flex: none;
  }
  .dot.live { background: var(--oc-primary, #888); animation: pulse 1s ease-in-out infinite; }
  .dot.wait { background: transparent; border: 1px solid var(--oc-primary, #888); }
  @keyframes pulse { 50% { opacity: .35; } }
  .value {
    font-size: 1.75rem;
    font-weight: 600;
    letter-spacing: -.025em;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .value.stale { color: var(--oc-muted, #888); }
  .unit { color: var(--oc-muted, #888); font-size: .8125rem; }
  .state {
    margin-left: auto;
    color: var(--oc-muted, #888);
    font-size: .8125rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* The curve: the last 30 s of generation rate. Older seconds dim out on the
     left instead of ending at a hard edge. */
  .sparkrow {
    display: block;
    margin: .375rem 0 .5rem;
    color: var(--oc-primary, #888);
  }
  .sparkrow svg {
    display: block;
    width: 100%;
    height: 1.75rem;
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 35%);
    mask-image: linear-gradient(90deg, transparent, #000 35%);
  }
  .spark-line { stroke: currentColor; }
  .spark-area { fill: currentColor; opacity: .16; }

  /* The divider, which fills while a prompt is read or a render runs. */
  .rule {
    height: .125rem;
    border-radius: .0625rem;
    background: color-mix(in srgb, var(--oc-fg, #888) 12%, transparent);
    overflow: hidden;
  }
  .rule .fill {
    display: block;
    height: 100%;
    width: 0%;
    background: var(--oc-primary, #6af);
    transition: width .25s linear;
  }

  /* The lines: a label and the one value worth a glance. A tap opens the rest. */
  .rows { padding-top: .125rem; font-size: .8125rem; }
  .line {
    display: flex;
    align-items: center;
    gap: .75rem;
    width: 100%;
    min-height: 2.25rem;
    margin: 0;
    padding: 0;
    border: 0;
    background: none;
    color: inherit;
    font: inherit;
    text-align: left;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .line:focus-visible { outline: 1px solid var(--oc-focus, #6af); outline-offset: 2px; border-radius: .25rem; }
  .k { color: var(--oc-muted, #888); white-space: nowrap; flex: none; }
  .v {
    flex: 1;
    min-width: 0;
    text-align: right;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .chev { flex: none; color: var(--oc-muted, #888); transition: transform .18s ease; }
  .row.open .chev { transform: rotate(90deg); }
  .row.warning .line .v { color: var(--oc-warning, #fb0); }
  .row.critical .line .v { color: var(--oc-error, #f66); }

  /* What is behind a line. It slides open; closed, it takes no room. */
  .det { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .18s ease; }
  .row.open .det { grid-template-rows: 1fr; }
  .in { min-height: 0; overflow: hidden; visibility: hidden; transition: visibility 0s .18s; }
  .row.open .in { visibility: visible; transition-delay: 0s; padding-bottom: .5rem; }
  .item { display: flex; align-items: baseline; gap: .75rem; line-height: 1.6; }
  /* A long value, such as another model's name, takes a second line instead of being cut. */
  .item.wrap .v { white-space: normal; overflow-wrap: anywhere; }
  .sub { color: var(--oc-muted, #888); font-size: .75rem; line-height: 1.5; }
  .sub.id { overflow-wrap: anywhere; user-select: text; -webkit-user-select: text; }

  .meters { display: flex; gap: .375rem; margin: .25rem 0; }
  .meter {
    display: block;
    flex: 1;
    height: .3125rem;
    border-radius: .15625rem;
    background: var(--oc-subtle, #3a3a3a);
    overflow: hidden;
  }
  .meter .fill {
    display: block;
    height: 100%;
    width: 0%;
    background: var(--oc-primary, #6af);
    border-radius: .15625rem;
  }
  .row.warning .meter .fill { background: var(--oc-warning, #fb0); }
  .row.critical .meter .fill { background: var(--oc-error, #f66); }

  /* The receipt: the reply's time, cut into reading, waiting, writing, tools. */
  .segs {
    display: flex;
    height: .3125rem;
    margin: .125rem 0 .25rem;
    border-radius: .15625rem;
    background: var(--oc-subtle, #3a3a3a);
    overflow: hidden;
  }
  .seg {
    display: block;
    height: 100%;
    width: 0%;
    background: var(--oc-primary, #6af);
    transition: width .5s ease;
  }
  .seg.read { opacity: .6; }
  .seg.wait { opacity: .25; }
  .seg.tool { opacity: .45; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script src="main.js"></script>
</body>
</html>
