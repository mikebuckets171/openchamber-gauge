<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Gauge</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--oc-font, system-ui, "Microsoft YaHei", sans-serif);
    font-size: 1rem;
    line-height: 1.5;
    color: var(--oc-fg, inherit);
    background: transparent;
    overflow: hidden;
  }
  #root { padding: .25rem 0 .5rem; }

  /* The headline: the speed, its unit, and the state on the far right. */
  .hero {
    display: flex;
    align-items: baseline;
    gap: .375rem;
    height: 2rem;
    white-space: nowrap;
    overflow: hidden;
  }
  .dot {
    display: inline-block;
    width: .4375rem;
    height: .4375rem;
    border-radius: 50%;
    background: var(--oc-primary, #888);
    align-self: center;
    flex: none;
  }
  .dot.live { background: var(--oc-primary, #888); animation: pulse 1s ease-in-out infinite; }
  .dot.wait { background: transparent; border: 1px solid var(--oc-primary, #888); }
  @keyframes pulse { 50% { opacity: .35; } }
  .value {
    font-size: 1.75rem;
    font-weight: 600;
    letter-spacing: -.025em;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .value.stale { color: var(--oc-muted, #888); }
  .unit { color: var(--oc-muted, #888); font-size: .8125rem; }
  .state {
    margin-left: auto;
    color: var(--oc-muted, #888);
    font-size: .8125rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* The curve: the last 30 s of generation rate. */
  .sparkrow {
    display: block;
    margin: .375rem 0 .75rem;
    color: var(--oc-primary, #888);
  }
  .sparkrow svg { display: block; width: 100%; height: 1.75rem; }
  .spark-line { stroke: currentColor; }
  .spark-area { fill: currentColor; opacity: .16; }

  /* The facts: a label, its value, and the meters under it. */
  .facts {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: .625rem .875rem;
    padding-top: .75rem;
    border-top: 1px solid color-mix(in srgb, var(--oc-fg, #888) 12%, transparent);
  }
  /* A short fact stacks: label above its value. */
  .fact { display: flex; flex-direction: column; gap: .125rem; min-width: 0; }
  /* A fact with a long value puts the label beside it: label left, value right. */
  .fact.wide {
    grid-column: 1 / -1;
    display: grid;
    grid-template-columns: auto minmax(0, 1fr);
    align-items: baseline;
    gap: .125rem .75rem;
  }
  .fact .k {
    font-size: .8125rem;
    letter-spacing: .03em;
    text-transform: uppercase;
    color: var(--oc-muted, #888);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .fact .v {
    font-size: .8125rem;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .fact.wide .v { text-align: right; }
  .fact.wide .meters { grid-column: 1 / -1; }
  .meters { display: flex; gap: .375rem; margin-top: .0625rem; }
  .meter {
    display: block;
    flex: 1;
    height: .3125rem;
    border-radius: .15625rem;
    background: var(--oc-subtle, #3a3a3a);
    overflow: hidden;
  }
  .meter i {
    display: block;
    height: 100%;
    width: 0%;
    background: var(--oc-primary, #6af);
    border-radius: .15625rem;
  }
  .fact.active .meter i { background: var(--oc-primary, #6af); }
  .fact.warning .meter i { background: var(--oc-warning, #fb0); }
  .fact.warning .v { color: var(--oc-warning, #fb0); }
  .fact.critical .meter i { background: var(--oc-error, #f66); }
  .fact.critical .v { color: var(--oc-error, #f66); }
</style>
</head>
<body>
<div id="root"></div>
<script src="main.js"></script>
</body>
</html>
